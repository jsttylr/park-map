name: probe-garmin
# One-off: look at how Garmin's new reply page sends a reply.
on:
  push:
    paths: [".github/workflows/probe-garmin.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "app/(reply)/reply/%5BtinyUrlId%5D/page-49656bd9170129e4.js" 8100-6a83417b40af16a4.js 7367-dd3110c591fd3a0f.js 5947-b267cdbbba004fe4.js; do
            echo "=== $u"; curl -sSL -A "Mozilla/5.0" "https://messenger.garmin.com/web/_next/static/chunks/$u" -o b.js; wc -c b.js
            grep -oE '.{0,200}createServerReference\([^)]*\).{0,200}' b.js | head -20
            grep -oiE '.{0,500}(sendReply|replyAction|tinyUrlId|messageText|ReplyMessage|/api/|fetch\().{0,700}' b.js | head -25
          done
