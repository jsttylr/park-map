name: probe-garmin
# One-off: look at how Garmin's new reply page sends a reply.
on:
  workflow_dispatch:
    inputs:
      ext:
        description: message id
        required: true
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: page
        env:
          EXT: ${{ inputs.ext }}
        run: |
          echo "::add-mask::$EXT"
          curl -sSL -A "Mozilla/5.0" -o page.html -w "%{http_code}\n" "https://messenger.garmin.com/r?extId=$EXT"
          wc -c page.html
          grep -oE 'src="[^"]+\.js"' page.html | sed -E 's/^src="//; s/"$//' | sort -u | tee js.txt
          echo "--- page text around reply/message/action"
          sed -e 's/></>\n</g' page.html | grep -v '^<script src' | grep -oiE '.{0,200}(textarea|<form|<input|button|server|action|maxLength|latitude|location).{0,200}' | head -80
      - name: chunks
        run: |
          for u in $(grep -E 'app/|page' js.txt); do echo "=== $u"; curl -sSL -A "Mozilla/5.0" "https://messenger.garmin.com$u" -o b.js; wc -c b.js; grep -oE '.{0,400}(createServerReference|callServer|findSourceMapURL).{0,400}' b.js | head -20; grep -oiE '.{0,300}(message|reply|tinyUrl).{0,300}' b.js | head -30; done
