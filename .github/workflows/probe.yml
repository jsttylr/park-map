name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Layers
        run: |
          show() {
            u=$1; w=${2:-1%3D1}
            echo "== $u ($w)"
            curl -sS -A "Mozilla/5.0" --max-time 60 "$u?f=json" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('name'), d.get('geometryType'), d.get('maxRecordCount'), [f['name'] for f in d.get('fields',[])], [(l['id'],l['name']) for l in d.get('layers',[])])" || true
            curl -sS -A "Mozilla/5.0" --max-time 60 "$u/query?where=$w&returnCountOnly=true&f=json"; echo
            curl -sS -A "Mozilla/5.0" --max-time 60 "$u/query?where=$w&outFields=*&returnGeometry=false&resultRecordCount=12&f=json" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(' ',{k:v for k,v in f['attributes'].items() if v not in (None,'',' ') and not k.lower().startswith('shape')}) for f in d.get('features',[])]" || true
          }
          show https://services1.arcgis.com/YfqBAUM5nWR3yhGP/ArcGIS/rest/services/gamelands_general/FeatureServer/21
          show https://kygisserver.ky.gov/arcgis/rest/services/WGS84WM_Services/Ky_Elk_Hunting_WGS84WM/MapServer
          show https://kygisserver.ky.gov/arcgis/rest/services/WGS84WM_Services/Ky_Elk_Hunting_WGS84WM/MapServer/4
          curl -sS "https://kygisserver.ky.gov/arcgis/rest/services/WGS84WM_Services?f=json" | python3 -c "import json,sys; [print(' svc',s['name']) for s in json.load(sys.stdin)['services']]"
