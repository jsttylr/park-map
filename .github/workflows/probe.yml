name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Layers
        shell: python3 {0}
        run: |
          import json, urllib.request, urllib.parse
          def get(u, **q):
              if q: u += "?" + urllib.parse.urlencode(q)
              try:
                  return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=60))
              except Exception as e:
                  return {"err": str(e)[:200]}
          def info(u):
              d = get(u, f="json")
              print("==", u, d.get("err") or d.get("error") or "", d.get("name"), [f["name"] for f in d.get("fields", [])], [(l["id"], l["name"]) for l in d.get("layers", [])][:40], [s["name"] for s in d.get("services", [])][:200])
          def group(u, field, where="1=1"):
              stats = json.dumps([{"statisticType": "count", "onStatisticField": field, "outStatisticFieldName": "n"}])
              d = get(u + "/query", where=where, groupByFieldsForStatistics=field, outStatistics=stats, f="json")
              print("  by", field, d.get("err") or d.get("error") or sorted(((f["attributes"].get(field), f["attributes"].get("n", f["attributes"].get("N", 0))) for f in d.get("features", [])), key=lambda x: -(x[1] or 0))[:60])
          def sample(u, where="1=1", n=8, fields="*"):
              d = get(u + "/query", where=where, outFields=fields, returnGeometry="false", resultRecordCount=n, f="json")
              for f in d.get("features", []): print("   ", {k: v for k, v in f["attributes"].items() if v not in (None, "", " ") and not k.lower().startswith("shape") and k.lower() not in ("globalid",)})
              if "features" not in d: print("   ", d)
          def search(q):
              d = get("https://www.arcgis.com/sharing/rest/search", q=q, num=25, f="json")
              print("## search", q)
              for r in d.get("results", []): print("   ", r["title"], "|", r["owner"], "|", r.get("url"))
          def names(u, field, where):
              d = get(u + "/query", where=where, outFields=field, returnGeometry="false", f="json")
              print("  ", where[:60], "->", d.get("err") or d.get("error") or sorted({str(f["attributes"].get(field)) for f in d.get("features", [])})[:150])
          def lays(u):
              d = get(u, f="json")
              info(u)
              for l in d.get("layers", [])[:12]:
                  lu = u + "/" + str(l["id"])
                  ld = get(lu, f="json")
                  if ld.get("geometryType") != "esriGeometryPolygon": continue
                  info(lu)
                  print("   count", get(lu + "/query", where="1=1", returnCountOnly="true", f="json"))
                  sample(lu, n=3)
          def osearch(q):
              d = get("https://www.arcgis.com/sharing/rest/search", q=q + ' AND (type:"Feature Service" OR type:"Map Service")', num=20, f="json")
              print("##", q)
              for r in d.get("results", []):
                  if "PADUS" in r["title"] or "PAD-US" in r["title"] or "Amrivers" in r["owner"]: continue
                  print("   ", r["title"], "|", r["owner"], "|", r.get("url"))
          w = "https://geodataservices.wdfw.wa.gov/arcgis/rest/services/WP_RealEstate/"
          for u in [w + "WildlifeAreas/MapServer", w + "Sites/MapServer", w + "ManagedPlaces/MapServer",
                    "https://services5.arcgis.com/4LKAHwqnBooVDUlX/arcgis/rest/services/ParkBoundaries/FeatureServer",
                    "https://services.arcgis.com/HQ0xoN0EzDPBOEci/arcgis/rest/services/State_Park_Boundaries/FeatureServer",
                    "https://maps.prd.state.or.us/arcgis/rest/services/Land_ownership/Oregon_State_Parks/FeatureServer",
                    "https://services.arcgis.com/uUvqNMGPm7axC2dD/arcgis/rest/services/StateForests_OwnershipManagedLands_View/FeatureServer",
                    "https://services.arcgis.com/RyxlXSfFi87rAosq/arcgis/rest/services/NDOWWMAs/FeatureServer"]:
              lays(u)
          info("https://gis.dnr.wa.gov/site3/rest/services/Public_Boundaries/WADNR_PUBLIC_Cadastre_OpenData/MapServer/6")
          sample("https://gis.dnr.wa.gov/site3/rest/services/Public_Boundaries/WADNR_PUBLIC_Cadastre_OpenData/MapServer/6", n=3)
          was = w + "WaterAccessSites/MapServer/0"
          names(was, "WaterAccessSiteName", "WaterAccessSiteName LIKE '%Jameson%' OR WaterAccessSiteName LIKE '%Silver%' OR WaterAccessSiteName LIKE '%Badger%' OR WaterAccessSiteName LIKE '%Rapjohn%' OR WaterAccessSiteName LIKE '%Ohop%' OR WaterAccessSiteName LIKE '%Munn%'")
          group(was, "ManagingEntity")
          hi = "https://geodata.hawaii.gov/arcgis/rest/services/Terrestrial/MapServer/1"
          group(hi, "type_defin"); names(hi, "xname", "xname LIKE '%Ewa%' OR xname LIKE '%Honolulu%' OR xname LIKE '%Kuli%' OR xname LIKE '%Waimanalo%' OR xname LIKE '%Kiholo%'")
          ca = "https://gis.parks.ca.gov/server/rest/services/EnterpriseGIS/CSPBoundaries_Portal/FeatureServer/0"
          names(ca, "UNIT_NAME", "UNIT_NAME LIKE '%Railroad%' OR UNIT_NAME LIKE '%Lake Valley%' OR UNIT_NAME LIKE '%Oceano%' OR UNIT_NAME LIKE '%Tijuana%' OR UNIT_NAME LIKE '%Hearst%' OR UNIT_NAME LIKE '%Cowell%'")
          ak = "https://arcgis.dnr.alaska.gov/arcgis/rest/services/OpenData/Recreational_ParkBoundary/FeatureServer/2"
          group(ak, "PRKTYPABRV")
          names(ak, "PARKNAME", "PARKNAME LIKE '%Anchor%' OR PARKNAME LIKE '%Big Lake%' OR PARKNAME LIKE '%Chilkoot%' OR PARKNAME LIKE '%Eagle Beach%' OR PARKNAME LIKE '%Chena%' OR PARKNAME LIKE '%Kenai%' OR PARKNAME LIKE '%Hatcher%'")
          od = "https://nrimp.dfw.state.or.us/arcgis/rest/services/ORHAM/ODFW_Wildlife_Areas/MapServer/0"
          group(od, "LandTypeID"); names(od, "AreaName", "1=1")
