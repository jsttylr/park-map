name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: ScienceBase files
        run: |
          for id in 652d4fc5d34e44db0e2ee45e 6759abcfd34edfeb8710a004 6759b69fd34edfeb8710a3ea; do
            echo "=== $id"
            curl -sSL "https://www.sciencebase.gov/catalog/item/$id?format=json" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          print(d.get("title")); print("parent", d.get("parentId"))
          for f in d.get("files",[]): print("F", f.get("name"), f.get("size"), f.get("url"))
          for f in d.get("webLinks",[]): print("W", f.get("title"), f.get("uri"))
          for f in d.get("distributionLinks",[]): print("D", f.get("title"), f.get("uri"))
          '
            curl -sSL "https://www.sciencebase.gov/catalog/items?parentId=$id&format=json&max=60&fields=title,files" | python3 -c '
          import json,sys
          d=json.load(sys.stdin)
          for it in d.get("items",[]):
            print(" child", it["id"], it.get("title"))
            for f in it.get("files",[])[:3]: print("   F", f.get("name"), f.get("size"), f.get("url"))
          '
          done
      - name: sota-az assets
        run: |
          curl -sSL https://api.github.com/repos/OffARO/sota-az/releases/latest | python3 -c 'import json,sys; d=json.load(sys.stdin); [print(a["name"], a["size"]) for a in d.get("assets",[])]' | grep -E '^(w|k|manifest)' | head
          curl -sSL https://github.com/OffARO/sota-az/releases/latest/download/w7w.geojson.gz | gunzip | head -c 1200; echo
      - name: tools
        run: ogr2ogr --version || echo "no gdal"; df -h . | tail -1
