name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for q in 'PAD-US 4.1' 'PADUS4_1' 'PAD-US 4.0 Fee' 'Protected Areas Database of the United States'; do
            echo "=== $q"
            curl -sS -G 'https://www.arcgis.com/sharing/rest/search' --data-urlencode "q=$q type:\"Feature Service\"" --data-urlencode 'num=25' --data-urlencode 'f=json' | python3 -c '
          import json,sys
          for r in json.load(sys.stdin).get("results",[]): print(r["owner"],"|",r["title"],"|",r.get("url"),"|",r.get("access"))'
          done
          echo "=== USGS org services"
          curl -sS 'https://services.arcgis.com/v01gqwM5QqNysAAi/arcgis/rest/services?f=json' | head -c 3000
