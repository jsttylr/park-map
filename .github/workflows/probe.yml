name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          base=https://services.arcgis.com/v01gqwM5QqNysAAi/arcgis/rest/services
          for s in Manager_Name_PADUS Fee_Managers_PADUS Proclamation_and_Other_Planning_Boundaries_PADUS Protection_Mechanism_Category_PADUS Manager_Type_PADUS; do
            echo "=== $s"
            curl -sS "$base/$s/FeatureServer?f=json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print([ (l["id"],l["name"]) for l in d.get("layers",[])], d.get("maxRecordCount"))'
            curl -sS "$base/$s/FeatureServer/0?f=json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("name"), d.get("maxRecordCount"), d.get("supportedQueryFormats"), d.get("capabilities")); print([f["name"] for f in d.get("fields",[])])'
            curl -sS "$base/$s/FeatureServer/0/query?where=1%3D1&returnCountOnly=true&f=json"; echo
            # Acadia point test with 2 km distance
            curl -sS "$base/$s/FeatureServer/0/query?geometry=-68.2034,44.31&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects&distance=2000&units=esriSRUnit_Meter&outFields=*&returnGeometry=false&f=json" | head -c 1500; echo
          done
