name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Layers
        shell: python3 {0}
        run: |
          import json, urllib.request, urllib.parse
          def get(u, **q):
              if q: u += "?" + urllib.parse.urlencode(q)
              try:
                  return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=60))
              except Exception as e:
                  return {"err": str(e)[:200]}
          def info(u):
              d = get(u, f="json")
              print("==", u, d.get("err") or d.get("error") or "", d.get("name"), [f["name"] for f in d.get("fields", [])], [(l["id"], l["name"]) for l in d.get("layers", [])][:40], [s["name"] for s in d.get("services", [])][:200])
          def group(u, field, where="1=1"):
              stats = json.dumps([{"statisticType": "count", "onStatisticField": field, "outStatisticFieldName": "n"}])
              d = get(u + "/query", where=where, groupByFieldsForStatistics=field, outStatistics=stats, f="json")
              print("  by", field, d.get("err") or d.get("error") or sorted(((f["attributes"].get(field), f["attributes"].get("n", f["attributes"].get("N", 0))) for f in d.get("features", [])), key=lambda x: -(x[1] or 0))[:60])
          def sample(u, where="1=1", n=8, fields="*"):
              d = get(u + "/query", where=where, outFields=fields, returnGeometry="false", resultRecordCount=n, f="json")
              for f in d.get("features", []): print("   ", {k: v for k, v in f["attributes"].items() if v not in (None, "", " ") and not k.lower().startswith("shape") and k.lower() not in ("globalid",)})
              if "features" not in d: print("   ", d)
          def search(q):
              d = get("https://www.arcgis.com/sharing/rest/search", q=q, num=25, f="json")
              print("## search", q)
              for r in d.get("results", []): print("   ", r["title"], "|", r["owner"], "|", r.get("url"))
          def names(u, field, where):
              d = get(u + "/query", where=where, outFields=field, returnGeometry="false", f="json")
              print("  ", where[:60], "->", d.get("err") or d.get("error") or sorted({str(f["attributes"].get(field)) for f in d.get("features", [])})[:150])
          def lays(u):
              d = get(u, f="json")
              info(u)
              for l in d.get("layers", [])[:12]:
                  lu = u + "/" + str(l["id"])
                  ld = get(lu, f="json")
                  if ld.get("geometryType") != "esriGeometryPolygon": continue
                  info(lu)
                  print("   count", get(lu + "/query", where="1=1", returnCountOnly="true", f="json"))
                  sample(lu, n=3)
          def osearch(q):
              d = get("https://www.arcgis.com/sharing/rest/search", q=q + ' AND (type:"Feature Service" OR type:"Map Service")', num=20, f="json")
              print("##", q)
              for r in d.get("results", []):
                  if "PADUS" in r["title"] or "PAD-US" in r["title"] or "Amrivers" in r["owner"]: continue
                  print("   ", r["title"], "|", r["owner"], "|", r.get("url"))
          nh = "https://nhgeodata.unh.edu/hosting/rest/services/Hosted/EC_Conservation/FeatureServer/0"
          group(nh, "ppagentype"); group(nh, "pptype"); group(nh, "ownertype")
          names(nh, "name", "name LIKE '%Annett%' OR name LIKE '%Ashenden%' OR name LIKE '%Davis-White%' OR name LIKE '%Lovewell%' OR name LIKE '%Max Israel%' OR name LIKE '%Merrimack River%' OR name LIKE '%Merriman%' OR name LIKE '%Mount Major%' OR name LIKE '%Nash Stream%' OR name LIKE '%White Farm%' OR name LIKE '%Eisenhower%' OR name LIKE '%Gardner Memorial%' OR name LIKE '%Taylor%Mill%' OR name LIKE '%Walski%'")
          sample(nh, "name LIKE '%Annett%' OR name LIKE '%Nash Stream%'", n=4, fields="name,p_name,ppagency,ppagentype,pptype,ownertype")
          names(nh, "name", "ppagentype=3 AND pptype='FO' AND name LIKE '%A%'")
          me = "https://gis.maine.gov/mapservices/rest/services/dep/Maine_DEP_Outstanding_National_Resource_Waters/MapServer/5"
          info(me); group(me, "HOLD1_TYPE"); group(me, "HOLD1_NAME"); group(me, "DESIGNATION")
          names(me, "PROJECT", "PROJECT LIKE '%Fort Point%' OR PROJECT LIKE '%Ossip%' OR PROJECT LIKE '%Holeb%' OR PROJECT LIKE '%Chamberlain%' OR PROJECT LIKE '%Carlton%'")
          ut = "https://gis.trustlands.utah.gov/mapping/rest/services/Land_Ownership/FeatureServer/0"
          names(ut, "label_state", "label_state LIKE '%Hatchery%' OR label_state LIKE '%Kamas%' OR label_state LIKE '%Willard%' OR label_state LIKE '%Desert Lake%' OR label_state LIKE '%Locomotive%' OR label_state LIKE '%Public Shooting%' OR label_state LIKE '%Richmond%' OR label_state LIKE '%Goslin%' OR label_state LIKE '%Causey%' OR label_state LIKE '%Millsite%' OR label_state LIKE '%Monte Cristo%' OR label_state LIKE '%Wedge%'")
          group(ut, "admin", "label_state LIKE '%Hatchery%'")
          ul = "https://services.arcgis.com/ZzrwjTRez6FJiOq4/arcgis/rest/services/ULTRA_Properties_2_view/FeatureServer"
          lays(ul)
          idw = "https://services.arcgis.com/FjJI5xHF2dUPVrgK/arcgis/rest/services/WildlifeManagementAreas/FeatureServer/0"
          names(idw, "Name", "1=1")
          mt = "https://fwp-gis.mt.gov/arcgis/rest/services/fwplnd/fwpLands/MapServer/2"
          names(mt, "NAME", "NAME LIKE '%Big Horn%' OR NAME LIKE '%Bonfield%' OR NAME LIKE '%Grey Cliff%' OR NAME LIKE '%Harper%' OR NAME LIKE '%Island Lake%' OR NAME LIKE '%Prewitt%' OR NAME LIKE '%Thoreau%'")
          nd = "https://services1.arcgis.com/GOcSXpzwBHyk2nog/ArcGIS/rest/services/NDGISHUB_Wildlife_Management_Areas/FeatureServer/0"
          names(nd, "Unit_Name", "Unit_Name LIKE '%Lone%' OR Unit_Name LIKE '%Maclean%' OR Unit_Name LIKE '%Raab%'")
