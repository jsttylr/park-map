name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Layers
        shell: python3 {0}
        run: |
          import json, urllib.request, urllib.parse
          def get(u, **q):
              if q: u += "?" + urllib.parse.urlencode(q)
              try:
                  return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=60))
              except Exception as e:
                  return {"err": str(e)[:200]}
          def info(u):
              d = get(u, f="json")
              print("==", u, d.get("err") or d.get("error") or "", d.get("name"), [f["name"] for f in d.get("fields", [])], [(l["id"], l["name"]) for l in d.get("layers", [])][:40], [s["name"] for s in d.get("services", [])][:200])
          def group(u, field, where="1=1"):
              stats = json.dumps([{"statisticType": "count", "onStatisticField": field, "outStatisticFieldName": "n"}])
              d = get(u + "/query", where=where, groupByFieldsForStatistics=field, outStatistics=stats, f="json")
              print("  by", field, d.get("err") or d.get("error") or sorted(((f["attributes"].get(field), f["attributes"].get("n", f["attributes"].get("N", 0))) for f in d.get("features", [])), key=lambda x: -(x[1] or 0))[:60])
          def sample(u, where="1=1", n=8, fields="*"):
              d = get(u + "/query", where=where, outFields=fields, returnGeometry="false", resultRecordCount=n, f="json")
              for f in d.get("features", []): print("   ", {k: v for k, v in f["attributes"].items() if v not in (None, "", " ") and not k.lower().startswith("shape") and k.lower() not in ("globalid",)})
              if "features" not in d: print("   ", d)
          def search(q):
              d = get("https://www.arcgis.com/sharing/rest/search", q=q, num=25, f="json")
              print("## search", q)
              for r in d.get("results", []): print("   ", r["title"], "|", r["owner"], "|", r.get("url"))
          def names(u, field, where):
              d = get(u + "/query", where=where, outFields=field, returnGeometry="false", f="json")
              print("  ", where[:60], "->", d.get("err") or d.get("error") or sorted({str(f["attributes"].get(field)) for f in d.get("features", [])})[:150])
          def lays(u):
              d = get(u, f="json")
              info(u)
              for l in d.get("layers", [])[:12]:
                  lu = u + "/" + str(l["id"])
                  ld = get(lu, f="json")
                  if ld.get("geometryType") != "esriGeometryPolygon": continue
                  info(lu)
                  print("   count", get(lu + "/query", where="1=1", returnCountOnly="true", f="json"))
                  sample(lu, n=3)
          def osearch(q):
              d = get("https://www.arcgis.com/sharing/rest/search", q=q + ' AND (type:"Feature Service" OR type:"Map Service")', num=20, f="json")
              print("##", q)
              for r in d.get("results", []):
                  if "PADUS" in r["title"] or "PAD-US" in r["title"] or "Amrivers" in r["owner"]: continue
                  print("   ", r["title"], "|", r["owner"], "|", r.get("url"))
          nd = "https://services1.arcgis.com/GOcSXpzwBHyk2nog/ArcGIS/rest/services/"
          for u in [nd + "NDGISHUB_State_Parks/FeatureServer", nd + "NDGISHUB_State_Forest/FeatureServer", nd + "NDGISHUB_Wildlife_Management_Areas/FeatureServer",
                    "https://fwp-gis.mt.gov/arcgis/rest/services/fwplnd/fwpLands/MapServer",
                    "https://gis.trustlands.utah.gov/mapping/rest/services/Land_Ownership/FeatureServer",
                    "https://nhgeodata.unh.edu/hosting/rest/services/Hosted/EC_Conservation/FeatureServer",
                    "https://gis.idfg.idaho.gov/server/rest/services/Access/MapServer",
                    "https://risegis.ri.gov/hosting/rest/services/RIDEM/Outdoor_Recreation_Map_v4/FeatureServer/21"]:
              lays(u)
          names(nd + "NDGISHUB_State_Parks/FeatureServer/0", "UNIT_NAME", "1=1")
          names(nd + "NDGISHUB_State_Forest/FeatureServer/0", "DESCRIPTION", "1=1")
          names(nd + "NDGISHUB_Wildlife_Management_Areas/FeatureServer/0", "UNIT_NAME", "UNIT_NAME LIKE '%Lone%' OR UNIT_NAME LIKE '%Maclean%' OR UNIT_NAME LIKE '%Raab%'")
          ut = "https://gis.trustlands.utah.gov/mapping/rest/services/Land_Ownership/FeatureServer/0"
          group(ut, "state_lgd"); group(ut, "admin")
          names(ut, "label_state", "state_lgd='State Wildlife Reserve/Management Area'")
          names(ut, "label_state", "state_lgd='State Parks and Recreation'")
          names(ut, "label_state", "state_lgd='Other State'")
          mt = "https://fwp-gis.mt.gov/arcgis/rest/services/fwplnd/fwpLands/MapServer/"
          for l in ("2", "5", "8"): print("   count", l, get(mt + l + "/query", where="1=1", returnCountOnly="true", f="json"))
          names(mt + "8", "NAME", "NAME LIKE '%Fish Creek%'"); names(mt + "5", "NAME", "NAME LIKE '%Finley%' OR NAME LIKE '%Somers%'")
          me = "https://gis.maine.gov/arcgis/rest/services/dep/Maine_DEP_Outstanding_National_Resource_Waters/MapServer/5"
          info(me); group(me, "HOLD1_NAME"); group(me, "DESIGNATION")
          names(me, "PROJECT", "PROJECT LIKE '%Fort Point%' OR PROJECT LIKE '%Ossip%' OR PROJECT LIKE '%Holeb%' OR PROJECT LIKE '%Chamberlain%' OR PROJECT LIKE '%Carlton%'")
          ri = "https://risegis.ri.gov/hosting/rest/services/RIDEM/Outdoor_Recreation_Map_v4/FeatureServer/21"
          group(ri, "DEM_DIV")
          names(ri, "NAME", "NAME LIKE '%Big River%' OR NAME LIKE '%Matunuck%' OR NAME LIKE '%Rome Point%' OR NAME LIKE '%Cronin%' OR NAME LIKE '%Patriots%' OR NAME LIKE '%Hillsdale%' OR NAME LIKE '%Barber%'")
          for q in ["North Dakota state historic sites", "State Historical Society of North Dakota sites",
                    "New Hampshire state forests DNCR", "New Hampshire conservation public lands",
                    "Idaho Fish and Game wildlife management areas", "Idaho airstrips",
                    "Utah DWR wildlife management areas", "Utah waterfowl management areas", "Utah state parks boundaries",
                    "Arizona Game and Fish wildlife areas", "Arizona state parks boundaries",
                    "Maine conserved lands", "Maine wildlife management areas MDIFW",
                    "Montana state trust lands", "Montana DNRC state forests"]:
              osearch(q)
