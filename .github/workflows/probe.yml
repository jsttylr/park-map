name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Layers
        shell: python3 {0}
        run: |
          import json, urllib.request, urllib.parse
          def get(u, **q):
              if q: u += "?" + urllib.parse.urlencode(q)
              try:
                  return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=60))
              except Exception as e:
                  return {"err": str(e)[:200]}
          def info(u):
              d = get(u, f="json")
              print("==", u, d.get("err") or d.get("error") or "", d.get("name"), [f["name"] for f in d.get("fields", [])], [(l["id"], l["name"]) for l in d.get("layers", [])][:40], [s["name"] for s in d.get("services", [])][:200])
          def group(u, field, where="1=1"):
              stats = json.dumps([{"statisticType": "count", "onStatisticField": field, "outStatisticFieldName": "n"}])
              d = get(u + "/query", where=where, groupByFieldsForStatistics=field, outStatistics=stats, f="json")
              print("  by", field, d.get("err") or d.get("error") or sorted(((f["attributes"].get(field), f["attributes"]["n"]) for f in d.get("features", [])), key=lambda x: -x[1])[:60])
          def sample(u, where="1=1", n=8, fields="*"):
              d = get(u + "/query", where=where, outFields=fields, returnGeometry="false", resultRecordCount=n, f="json")
              for f in d.get("features", []): print("   ", {k: v for k, v in f["attributes"].items() if v not in (None, "", " ") and not k.lower().startswith("shape") and k.lower() not in ("globalid",)})
              if "features" not in d: print("   ", d)
          def search(q):
              d = get("https://www.arcgis.com/sharing/rest/search", q=q, num=25, f="json")
              print("## search", q)
              for r in d.get("results", []): print("   ", r["title"], "|", r["owner"], "|", r.get("url"))
          A="https://services1.arcgis.com/"
          for u in ["https://services1.arcgis.com/59dBAbzYnRk8johU/arcgis/rest/services/SRWMD_LM_Ownership/FeatureServer",
                    "https://services.arcgis.com/9Jk4Zl9KofTtvg3x/arcgis/rest/services/FL_Conservation_Lands_web/FeatureServer",
                    A+"jRf8jjFwxedITdFe/arcgis/rest/services/Public_WMA_Boundaries/FeatureServer",
                    "https://services3.arcgis.com/Jdnp1TjADvSDxMAX/arcgis/rest/services/DNRLOTSParcelsOPENDATA/FeatureServer",
                    "https://services3.arcgis.com/Jdnp1TjADvSDxMAX/arcgis/rest/services/DNRManagementBoundariesOPENDATA/FeatureServer",
                    "https://dnrmaps.wi.gov/arcgis/rest/services/LF_DML/LF_AGOL_STAGING_WTM_Ext/MapServer",
                    A+"q2CglofYX6ACNEeu/arcgis/rest/services/KDWPT_Wildlife_Areas/FeatureServer",
                    A+"q2CglofYX6ACNEeu/arcgis/rest/services/KDWP_Spatial_Directory_WFL1/FeatureServer",
                    A+"6euNCaGPCgCzgAVF/arcgis/rest/services/LDWF_WMA_Refuge/FeatureServer",
                    "https://services6.arcgis.com/DZHaqZm9cxOD4CWM/arcgis/rest/services/NYS_DEC_Lands/FeatureServer",
                    "https://services.arcgis.com/KTcxiTD9dsQw4r7Z/arcgis/rest/services/TPWD_WMAs_and_State_Parks_Boundaries/FeatureServer",
                    A+"1mtXwieMId59thmg/arcgis/rest/services/WMA_Boundaries_4PublicDistribution/FeatureServer",
                    "https://services2.arcgis.com/r6iFVcMJeA4kB4GC/arcgis/rest/services/LandInventory/FeatureServer",
                    A+"QWdNfRs7lkPq4g4Q/arcgis/rest/services/Open_Space__State_Owned__Generalized_h/FeatureServer",
                    "https://ca.dep.state.fl.us/arcgis/rest/services/OpenData/PARKS_BOUNDARIES/MapServer"]:
              d = get(u, f="json")
              info(u)
              for l in d.get("layers", [])[:14]:
                  lu = u + "/" + str(l["id"])
                  ld = get(lu, f="json")
                  if ld.get("geometryType") != "esriGeometryPolygon": continue
                  info(lu)
                  print("   count", get(lu + "/query", where="1=1", returnCountOnly="true", f="json"))
                  sample(lu, n=4)
          for q in ["Nebraska Game and Parks Commission", "NGPC public access", "Oklahoma Historical Society", "Kansas Historical Society state historic sites", "Michigan state harbors", "Wisconsin DNR state natural areas"]:
              search(q + ' AND (type:"Feature Service" OR type:"Map Service")')
