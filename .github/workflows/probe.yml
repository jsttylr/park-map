name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Layers
        shell: python3 {0}
        run: |
          import json, urllib.request, urllib.parse
          def get(u, **q):
              if q: u += "?" + urllib.parse.urlencode(q)
              try:
                  return json.load(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": "Mozilla/5.0"}), timeout=60))
              except Exception as e:
                  return {"err": str(e)[:200]}
          def info(u):
              d = get(u, f="json")
              print("==", u, d.get("err") or d.get("error") or "", d.get("name"), [f["name"] for f in d.get("fields", [])], [(l["id"], l["name"]) for l in d.get("layers", [])][:40], [s["name"] for s in d.get("services", [])][:200])
          def group(u, field, where="1=1"):
              stats = json.dumps([{"statisticType": "count", "onStatisticField": field, "outStatisticFieldName": "n"}])
              d = get(u + "/query", where=where, groupByFieldsForStatistics=field, outStatistics=stats, f="json")
              print("  by", field, d.get("err") or d.get("error") or sorted(((f["attributes"].get(field), f["attributes"]["n"]) for f in d.get("features", [])), key=lambda x: -x[1])[:60])
          def sample(u, where="1=1", n=8, fields="*"):
              d = get(u + "/query", where=where, outFields=fields, returnGeometry="false", resultRecordCount=n, f="json")
              for f in d.get("features", []): print("   ", {k: v for k, v in f["attributes"].items() if v not in (None, "", " ") and not k.lower().startswith("shape") and k.lower() not in ("globalid",)})
              if "features" not in d: print("   ", d)
          def search(q):
              d = get("https://www.arcgis.com/sharing/rest/search", q=q, num=25, f="json")
              print("## search", q)
              for r in d.get("results", []): print("   ", r["title"], "|", r["owner"], "|", r.get("url"))
          def names(u, field, where):
              d = get(u + "/query", where=where, outFields=field, returnGeometry="false", f="json")
              print("  ", where[:60], "->", d.get("err") or d.get("error") or sorted({f["attributes"].get(field) for f in d.get("features", [])})[:40])
          A="https://services1.arcgis.com/"
          fnai = "https://services.arcgis.com/9Jk4Zl9KofTtvg3x/arcgis/rest/services/FL_Conservation_Lands_web/FeatureServer/9"
          group(fnai, "MATYPE2"); group(fnai, "MANAGING_A")
          for w in ["Cuba Bay", "Sugar Creek", "Osteen", "Hilochee", "Escribano", "Hickory Hammock", "Chandler Slough", "Catfish Creek", "Plank Road", "Beker", "Olustee", "Fort Foster", "Shoal River", "Ney Landrum", "Yellow River", "Micco", "Wysong", "47 Bridge", "Mattair", "Natural Well", "Sneads", "Seven Bridges", "Nubbin", "Lower Reedy", "Deep Creek", "Avoca", "Linville", "Roline"]:
              names(fnai, "MANAME", "MANAME LIKE '%" + w + "%'")
          srwmd = "https://services1.arcgis.com/59dBAbzYnRk8johU/arcgis/rest/services/SRWMD_LM_Ownership/FeatureServer/0"
          group(srwmd, "CA_NAME"); group(srwmd, "INTEREST")
          d = get(srwmd + "/query", where="1=1", outFields="TRACT_NAME", returnGeometry="false", returnDistinctValues="true", f="json")
          print("  tracts", sorted({f["attributes"]["TRACT_NAME"] or "" for f in d.get("features", [])}))
          okw = A+"jRf8jjFwxedITdFe/arcgis/rest/services/Public_WMA_Boundaries/FeatureServer/1"
          group(okw, "WMATYPE"); group(okw, "OWNERSHIP"); names(okw, "WMANAME", "1=1")
          d = get(okw + "/query", where="1=1", outFields="WMANAME", returnGeometry="false", f="json"); print("  ok all", sorted(f["attributes"]["WMANAME"] for f in d.get("features", [])))
          mi = "https://services3.arcgis.com/Jdnp1TjADvSDxMAX/arcgis/rest/services/DNRLOTSParcelsOPENDATA/FeatureServer/13"
          group(mi, "Division")
          for w in ["Game", "Harbor", "Wildlife", "Flooding", "Hatchery", "Wilderness", "Tobico", "Clair"]:
              names(mi, "UnitName", "UnitName LIKE '%" + w + "%'")
          mip = "https://services3.arcgis.com/Jdnp1TjADvSDxMAX/arcgis/rest/services/DNRManagementBoundariesOPENDATA/FeatureServer/8"
          names(mip, "Facility", "1=1")
          info("https://services3.arcgis.com/Jdnp1TjADvSDxMAX/arcgis/rest/services/DNRReferenceAssetsOPENDATA/FeatureServer")
          wi = "https://dnrmaps.wi.gov/arcgis/rest/services/LF_DML/LF_AGOL_STAGING_WTM_Ext/MapServer/0"
          group(wi, "PROGRAM")
          for w in ["Lakeshore", "Big Bay", "Brule Glacial", "Chimney Rock", "Long Lake", "Mauthe", "Meridian", "Bear Beach", "Belden", "Empire", "Ericson", "Scuppernong", "Adell", "Johnson", "Pleasant Valley", "Schmit", "Sette", "Swinging", "Big Spring", "Blue River", "Spring Lake", "La Crosse"]:
              names(wi, "PROP_NAME", "PROP_NAME LIKE '%" + w + "%'")
          ksw = A+"q2CglofYX6ACNEeu/arcgis/rest/services/KDWPT_Wildlife_Areas/FeatureServer/0"
          group(ksw, "MGT_UNIT")
          ksp = A+"q2CglofYX6ACNEeu/arcgis/rest/services/KDWP_Spatial_Directory_WFL1/FeatureServer/4"
          group(ksp, "MGT_UNIT")
          for w in ["Browning", "Willow", "Melvern", "Mined Land", "Meade", "Mine Creek", "Fall River", "Veterans", "Smoky Hill", "Toronto", "Grinter", "Kaw Mission", "Pawnee", "Cottonwood Ranch", "Territorial", "Goodnow", "Sac", "Marais", "Hatchery", "Milford"]:
              names(ksw, "NAME", "NAME LIKE '%" + w + "%'"); names(ksp, "NAME", "NAME LIKE '%" + w + "%'")
          la = A+"6euNCaGPCgCzgAVF/arcgis/rest/services/LDWF_WMA_Refuge/FeatureServer/0"
          d = get(la + "/query", where="1=1", outFields="NAME", returnGeometry="false", f="json"); print("  la all", sorted(f["attributes"]["NAME"] for f in d.get("features", [])))
          ny = "https://services6.arcgis.com/DZHaqZm9cxOD4CWM/arcgis/rest/services/NYS_DEC_Lands/FeatureServer/0"
          group(ny, "CATEGORY")
          for w in ["Iona", "Dannemora", "Tibbetts", "North-South", "Little John", "Fish Creek", "Watson", "Raquette Boreal", "Blue Hill"]:
              names(ny, "FACILITY", "FACILITY LIKE '%" + w + "%'")
          tx = "https://services1.arcgis.com/1mtXwieMId59thmg/arcgis/rest/services/WMA_Boundaries_4PublicDistribution/FeatureServer/0"
          names(tx, "LoName", "LoName LIKE '%Matagorda%' OR LoName LIKE '%Nature%'")
          txp = "https://services.arcgis.com/KTcxiTD9dsQw4r7Z/arcgis/rest/services/TPWD_WMAs_and_State_Parks_Boundaries/FeatureServer/1"
          group(txp, "BndryType"); names(txp, "LoName", "1=1")
          ia = "https://services2.arcgis.com/r6iFVcMJeA4kB4GC/arcgis/rest/services/LandInventory/FeatureServer/"
          group(ia + "0", "TYPE"); group(ia + "0", "MANAGER")
          info(ia + "4"); sample(ia + "4", n=3)
          for w in ["Blackhawk", "Black Hawk", "Hawthorn", "Blackburn", "La Soya", "Soya"]:
              names(ia + "0", "NAME", "NAME LIKE '%" + w + "%'")
          nj = A+"QWdNfRs7lkPq4g4Q/arcgis/rest/services/Open_Space__State_Owned__Generalized_h/FeatureServer/67"
          group(nj, "FEATURE_CLASS"); group(nj, "LAND_MANAGER_AGENCY"); sample(nj, n=3)
          for w in ["Warren Grove", "D.O.D", "DOD", "Andalora"]:
              names(nj, "FEATURE_NAME", "FEATURE_NAME LIKE '%" + w + "%'")
          ne = "https://services5.arcgis.com/IOshH1zLrIieqrNk/arcgis/rest/services/"
          for u in [ne + "NPGCProperties2023_2024/FeatureServer", ne + "Park_Areas/FeatureServer"]:
              info(u)
              info(u + "/0"); print("   count", get(u + "/0/query", where="1=1", returnCountOnly="true", f="json")); sample(u + "/0", n=3)
