name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: List agency map services
        shell: python
        run: |
          import json, urllib.request, urllib.parse, re
          def get(u):
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers={'User-Agent': 'park-map'}), timeout=60) as r:
                      return json.load(r)
              except Exception as e:
                  return {'error': str(e)}
          def ls(root, pat='.'):
              print('\n##', root)
              d = get(root + '?f=json')
              if 'error' in d: print('  ERR', d['error']); return
              for f in d.get('folders', []):
                  if re.search(pat, f, re.I): print('  folder', f)
              for s in d.get('services', []):
                  if re.search(pat, s['name'], re.I): print('  ', s['name'], s['type'])
          def layer(u):
              d = get(u + '?f=json')
              if 'error' in d: print('\n###', u, 'ERR', d['error']); return
              if 'layers' in d:
                  print('\n###', u, [(l['id'], l['name']) for l in d['layers']]); return
              n = get(u + '/query?where=1%3D1&returnCountOnly=true&f=json')
              print('\n###', u, d.get('name'), d.get('geometryType'), 'max', d.get('maxRecordCount'), 'count', n.get('count'))
              print('   fields', [f['name'] for f in d.get('fields', [])])
              s = get(u + '/query?where=1%3D1&outFields=*&returnGeometry=false&resultRecordCount=3&f=json')
              for f in s.get('features', [])[:3]: print('   ', {k: v for k, v in f['attributes'].items() if v not in (None, '', ' ')})
          def search(q):
              print('\n## AGOL search:', q)
              d = get('https://www.arcgis.com/sharing/rest/search?' + urllib.parse.urlencode({'q': q + ' type:"Feature Service"', 'num': 15, 'f': 'json'}))
              for r in d.get('results', []): print('  ', r['owner'], '|', r['title'], '|', r.get('url'))
          import itertools
          def deep(u):
              d = get(u + '?f=json')
              if 'error' in d: print('\n###', u, 'ERR', d['error']); return
              ls_ = d.get('layers')
              if ls_ is None: layer(u); return
              print('\n#', u, [(l['id'], l['name']) for l in ls_])
              for l in ls_[:6]: layer(u + '/' + str(l['id']))
          for u in ['https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/NATT_TRANS_NSTTrail/FeatureServer', 'https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/NEEN_BND_NationalScenicTrailCenterline_ln/FeatureServer', 'https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/CAJO_Captain_John_Smith_Chesapeake_NHT_Centerline_ln/FeatureServer', 'https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/Sta_Spangled_Banner_National_Historic_Trail_Official_Centerline/FeatureServer', 'https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/Selma_to_Montgomery_National_Historic_Trail_Official/FeatureServer', 'https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/OREG_NHT/FeatureServer', 'https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/CALI_NHT/FeatureServer', 'https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/MOPI_NHT/FeatureServer', 'https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/POEX_NHT/FeatureServer', 'https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/SAFE_NHT/FeatureServer', 'https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/TRTE_NHT/FeatureServer', 'https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/OLSP_NHT/FeatureServer', 'https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/ELCA_NHT/FeatureServer', 'https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/ELTE_NHT/FeatureServer', 'https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/JUBA_NHT_/FeatureServer', 'https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/Overmountain_Victory_National_Historic_Trail_Official_Temp/FeatureServer', 'https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/Iditarod_National_Historic_Trail_BLM_Official_Temp/FeatureServer', 'https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/Lewis_and_Clark_National_Historic_Trail_Congression