name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Service directories
        run: |
          for d in https://services1.arcgis.com/YfqBAUM5nWR3yhGP/ArcGIS/rest/services https://kygisportalservices.ky.gov/server/rest/services/KDFWR https://kygisserver.ky.gov/arcgis/rest/services https://tdeconline.tn.gov/arcgis/rest/services https://services1.arcgis.com/cTNi34MxOdcfum3A/ArcGIS/rest/services; do echo "== $d"; curl -sS --max-time 60 "$d?f=json" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(' dir',f) for f in d.get('folders',[])]; [print(' svc',s['name'],s['type']) for s in d.get('services',[])]" || true; done
      - name: Layers
        if: always()
        run: |
          for u in https://mdgeodata.md.gov/imap/rest/services/Environment/MD_ProtectedLands/FeatureServer/0 https://tdeconline.tn.gov/arcgis/rest/services/TN_Natural_Areas/FeatureServer/0 https://tdeconline.tn.gov/arcgis/rest/services/TDEC_Public_Lands/FeatureServer/0 https://services1.arcgis.com/cTNi34MxOdcfum3A/ArcGIS/rest/services/WV_Master_PublicLands_042120/FeatureServer/0; do
            echo "== $u"
            curl -sS --max-time 60 "$u?f=json" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('name'), d.get('geometryType'), d.get('maxRecordCount'), [f['name'] for f in d.get('fields',[])])" || true
            curl -sS --max-time 60 "$u/query?where=1%3D1&returnCountOnly=true&f=json"; echo
            curl -sS --max-time 60 "$u/query?where=1%3D1&outFields=*&returnGeometry=false&resultRecordCount=8&f=json" | python3 -c "import json,sys; d=json.load(sys.stdin); [print(' ',{k:v for k,v in f['attributes'].items() if v not in (None,'') and not k.lower().startswith('shape')}) for f in d.get('features',[])]" || true
          done
