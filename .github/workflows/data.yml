name: build-data
on:
  push:
    branches-ignore: [main]
    paths: ['cmd/builddata/**', 'internal/**', '.github/workflows/data.yml']
  workflow_dispatch:
  schedule:
    - cron: '0 6 2 * *' # monthly
jobs:
  us-parks:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Download POTA park list
        run: curl -fsSL -o all_parks_ext.csv https://pota.app/all_parks_ext.csv && wc -l all_parks_ext.csv
      - name: Match parks to PAD-US boundaries
        run: go run ./cmd/builddata -pota all_parks_ext.csv -out us-parks.geojson.gz -report report.csv
      - name: Output sizes
        run: ls -la us-parks.geojson.gz report.csv
      - uses: actions/upload-artifact@v4
        with:
          name: us-parks
          path: |
            us-parks.geojson.gz
            report.csv
