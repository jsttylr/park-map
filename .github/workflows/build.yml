name: build
on:
  push:
    paths-ignore: ['**.md', 'unraid/**', 'docker-compose.yml']
  workflow_dispatch:
  schedule:
    - cron: '0 6 2 * *' # monthly, for new parks, summits and activation zones
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - run: node test/coord.test.js

  data:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Month
        id: month
        run: echo "m=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cached PAD-US download
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: padus.geojsonl.gz
          key: padus-4.1-v2-${{ steps.month.outputs.m }}
      # Preferred source: the official PAD-US geodatabase zip, uploaded by hand to a
      # "padus-4.1" release (ScienceBase puts it behind a captcha).
      - name: PAD-US from the release file
        id: release
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release download padus-4.1 -R "$GITHUB_REPOSITORY" -p '*.zip' -O padus.zip; then echo "no release file"; exit 0; fi
          sudo apt-get update -qq && sudo apt-get install -y -qq gdal-bin > /dev/null
          unzip -q padus.zip -d padus && rm padus.zip
          gdb=$(find padus -maxdepth 3 -name '*.gdb' -type d | head -1)
          ogrinfo -ro -q "$gdb" | tee layers.txt
          : > padus.geojsonl
          for kind in Fee Designation Proclamation; do
            layer=$(grep -oE "PADUS[0-9_]*${kind}\b" layers.txt | head -1)
            echo "$kind -> $layer"
            ogr2ogr -f GeoJSONSeq -t_srs EPSG:4326 -simplify 5 -nlt MULTIPOLYGON -skipfailures -lco COORDINATE_PRECISION=5 \
              -sql "SELECT Unit_Nm, Loc_Nm, Mang_Name, Des_Tp, State_Nm, '$kind' AS FeatClass FROM $layer" /vsistdout/ "$gdb" >> padus.geojsonl
          done
          rm -rf padus
          gzip padus.geojsonl && ls -la padus.geojsonl.gz
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: PAD-US from the USGS web service (fallback)
        if: steps.cache.outputs.cache-hit != 'true' && steps.release.outputs.ok != 'true'
        run: go run ./cmd/fetchpadus -out padus.geojsonl.gz
      - name: Save PAD-US cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: padus.geojsonl.gz
          key: padus-4.1-v2-${{ steps.month.outputs.m }}
      - name: Download POTA park list
        run: curl -fsSL -o all_parks_ext.csv https://pota.app/all_parks_ext.csv && wc -l all_parks_ext.csv
      # Trail routes come from OpenStreetMap: each state with a trail park is
      # downloaded from Geofabrik and cut down to routes and paths, then
      # matched to the parks. Cached for the month.
      - name: Cached trail routes
        id: trails
        uses: actions/cache/restore@v4
        with:
          path: trails.geojsonl.gz
          key: trails-v4-${{ steps.month.outputs.m }}
      - name: Trail routes from OpenStreetMap
        id: osm
        if: steps.trails.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 90
        run: |
          sudo apt-get install -y -qq osmium-tool > /dev/null
          for s in $(go run ./cmd/fetchtrails -pota all_parks_ext.csv -states); do
            curl -fsSL --retry 3 -o state.osm.pbf "https://download.geofabrik.de/north-america/us/$s-latest.osm.pbf"
            osmium tags-filter --overwrite -o "f-$s.osm.pbf" state.osm.pbf r/route=hiking,foot,walking,bicycle,mtb,horse,historic,canoe,ski,inline_skates,running,fitness_trail w/highway=path,footway,cycleway,bridleway
            rm state.osm.pbf
          done
          osmium merge --overwrite -o us-trails.osm.pbf f-*.osm.pbf && rm f-*.osm.pbf && ls -la us-trails.osm.pbf
          go run ./cmd/fetchtrails -pota all_parks_ext.csv -osm us-trails.osm.pbf -out trails.geojsonl.gz
      - name: Save trail routes cache
        if: steps.trails.outputs.cache-hit != 'true' && steps.osm.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: trails.geojsonl.gz
          key: trails-v4-${{ steps.month.outputs.m }}
      # Agency maps that fill in parks PAD-US doesn't draw (BLM, FWS, Army
      # Corps, Reclamation, NPS) and the official national historic trail
      # routes. Cached for the month; a service that's down only leaves its
      # parks as they were.
      - name: Cached agency layers
        id: agency
        uses: actions/cache/restore@v4
        with:
          path: agency-*.geojsonl.gz
          key: agency-v2-${{ steps.month.outputs.m }}
      - name: Agency layers
        id: fetchagency
        if: steps.agency.outputs.cache-hit != 'true'
        continue-on-error: true
        timeout-minutes: 60
        run: go run ./cmd/fetchlayers -areas agency-areas.geojsonl.gz -lines agency-lines.geojsonl.gz && ls -la agency-*.geojsonl.gz
      - name: Save agency layers cache
        if: steps.agency.outputs.cache-hit != 'true' && steps.fetchagency.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: agency-*.geojsonl.gz
          key: agency-v2-${{ steps.month.outputs.m }}
      - name: Use official trail routes over OpenStreetMap
        run: |
          if [ -s agency-lines.geojsonl.gz ]; then
            M=""; if [ -s trails.geojsonl.gz ]; then M="-merge trails.geojsonl.gz"; fi
            go run ./cmd/fetchtrails -pota all_parks_ext.csv -official agency-lines.geojsonl.gz $M -out trails-all.geojsonl.gz && mv trails-all.geojsonl.gz trails.geojsonl.gz
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Draw trails 100 ft either side of the route
        run: |
          if [ -s trails.geojsonl.gz ]; then pip install -q shapely==2.1.1 pyproj==3.7.1 && python3 scripts/buffer_trails.py trails.geojsonl.gz trail-areas.geojsonl.gz; fi
      - name: Match parks to boundaries
        run: |
          T=""; if [ -s trail-areas.geojsonl.gz ]; then T="-trails trail-areas.geojsonl.gz"; fi
          A=""; if [ -s agency-areas.geojsonl.gz ]; then A="agency-areas.geojsonl.gz"; fi
          mkdir -p data && go run ./cmd/builddata -pota all_parks_ext.csv -out data/us-parks.geojson.gz -report report.csv $T -show US-10139,US-4526,US-0171,US-5730,US-5751,US-0573 padus.geojsonl.gz $A
      - name: Download SOTA summits and sotl.as activation zones
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsSL -o summitslist.csv https://storage.sota.org.uk/summitslist.csv && wc -l summitslist.csv
          gh release download -R OffARO/sota-az -D az -p 'w*.geojson.gz' -p 'k*.geojson.gz' && ls az | wc -l
      - name: Build summits file
        run: go run ./cmd/buildsota -summits summitslist.csv -az az -out data/sota.geojson.gz
      - name: Work out the n-fer overlap patches
        timeout-minutes: 30
        run: go run ./cmd/parkmap -data data -write-regions data/nfer.geojson.gz
      - name: Load everything and print sample lookups
        timeout-minutes: 20
        run: go run ./cmd/parkmap -data data -selftest -explain US-9906,US-9920,US-4556,US-10139,US-4526 -nfer-report nfer.csv
      - name: Output sizes
        run: ls -la padus.geojsonl.gz data report.csv
      - uses: actions/upload-artifact@v4
        with:
          name: map-data
          path: |
            data/
            report.csv
            nfer*.csv

  docker:
    runs-on: ubuntu-latest
    needs: [test, data]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: map-data
      - run: ls -la data
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # The match report, pushed to the reports branch so it can be read without
  # downloading the build's files.
  report:
    runs-on: ubuntu-latest
    needs: [data]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: map-data
      - name: Push report.csv to the reports branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir r && cp report.csv nfer*.csv r/ && cd r && git init -q -b reports && git add *.csv
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Match report for ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}" reports

  # README screenshots, refreshed on every build of main.
  screenshots:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [data]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: map-data
      - name: Start the map
        run: |
          go build -o parkmap ./cmd/parkmap
          ./parkmap -data data -listen 127.0.0.1:8075 > server.log 2>&1 &
          for i in $(seq 120); do curl -sf http://127.0.0.1:8075/api/info && break; sleep 2; done
      - name: Take screenshots
        run: |
          mkdir -p shots shotsrc && cp .github/screenshots.mjs shotsrc/ && cd shotsrc
          npm init -y > /dev/null && npm install -s playwright@1.56.0 && npx playwright install --with-deps chromium > /dev/null
          node screenshots.mjs http://127.0.0.1:8075 ../shots
      - name: Publish to the screenshots release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view screenshots > /dev/null 2>&1 || gh release create screenshots --title "Screenshots" --notes "Images used in the README, refreshed by each build of main." --latest=false
          gh release upload screenshots shots/*.png --clobber
      - if: always()
        run: tail -20 server.log
