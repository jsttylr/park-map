# Park Map on a Docker host. Start it with: docker compose up -d
services:
  park-map:
    # "latest" is the newest build from main; use a branch name for a test build.
    image: ghcr.io/jsttylr/park-map:latest
    container_name: park-map
    restart: unless-stopped
    ports:
      - "8075:8075"
    volumes:
      # Satellite gateway settings (mail and SOTA logins) and its log.
      - ./config:/config
    environment:
      # Password for the settings page; any user name works.
      PARK_MAP_ADMIN_PASSWORD: "change-me"
